services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3000
      - DATABASE_URL=postgres://payload:${SERVICE_PASSWORD_POSTGRES}@db:5432/payload
      - PAYLOAD_SECRET=${SERVICE_PASSWORD_64_PAYLOAD}
      - SITE_URL=${SERVICE_FQDN_APP}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NOINDEX=${NOINDEX:-1}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=payload
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=payload
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payload']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  media:
  pgdata:
